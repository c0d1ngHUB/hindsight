# Self-hosted Runner auf dem Desktop (aiex-desktop-*), nur Prüfungen; kein Veröffentlichen, kein Deployment.
name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: [self-hosted, desktop]
    timeout-minutes: 40
    env: {}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Run Hermes integration regression suite (not full monorepo CI)
      shell: bash
      run: 'set -euo pipefail

        uv run --project hindsight-integrations/hermes --group dev python -m pytest hindsight-integrations/hermes/tests -q'
